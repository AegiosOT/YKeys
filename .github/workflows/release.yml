name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Empty until the SignPath project exists and the secret is added; every
      # signing step is skipped while it is empty, so releases ship unsigned
      # rather than failing.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch runs on main by default; always build the tagged commit.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/YKeys.Tests -c Release

      # -p:Version stamps the PE version resource from the tag; SignPath's
      # artifact configuration restricts signing on the PE product name
      # (Product=YKeys), and the smoke test below enforces the version.
      - name: Publish ykeys (NativeAOT)
        run: dotnet publish src/YKeys -r win-x64 -c Release -o publish -p:Version=$($env:TAG.TrimStart('v'))

      # A binary that cannot report its own version — or reports one that does
      # not match the tag — is not shippable.
      - name: Smoke-test
        run: |
          $version = $env:TAG.TrimStart('v')
          $reported = (& "./publish/ykeys.exe" --version) -join ''
          if ($LASTEXITCODE -ne 0) {
            throw "ykeys.exe --version exited with $LASTEXITCODE"
          }
          Write-Host $reported
          if ($reported -ne "ykeys $version") {
            throw "ykeys.exe reports '$reported' but the tag says 'ykeys $version' — bump the Version const before tagging."
          }
          # The PE version resource must match too — this check is the only
          # gate enforcing it (SignPath pins only the product name).
          $pv = (Get-Item "./publish/ykeys.exe").VersionInfo.ProductVersion
          if ($pv -ne $version -and -not $pv.StartsWith("$version+")) {
            throw "ykeys.exe PE ProductVersion is '$pv', expected '$version' — was -p:Version dropped from the publish step?"
          }

      # --- Code signing (SignPath Foundation) -------------------------------
      # Signs ykeys.exe in place before the zip and checksums see it. The
      # submit step blocks until the signing request is manually approved at
      # app.signpath.io.
      - name: Upload unsigned binary
        if: env.SIGNPATH_API_TOKEN != ''
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-binary
          path: publish/ykeys.exe
          retention-days: 1

      - name: Sign binary (SignPath)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ykeys
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '3600'
          output-artifact-directory: publish/signed

      - name: Replace binary with signed one
        if: env.SIGNPATH_API_TOKEN != ''
        run: |
          Copy-Item publish/signed/ykeys.exe -Destination publish -Force
          $version = $env:TAG.TrimStart('v')
          $sig = Get-AuthenticodeSignature publish/ykeys.exe
          if ($sig.Status -ne 'Valid') {
            throw "ykeys.exe signature status is $($sig.Status)"
          }
          Write-Host "ykeys.exe signed by: $($sig.SignerCertificate.Subject)"
          $reported = (& "./publish/ykeys.exe" --version) -join ''
          if ($LASTEXITCODE -ne 0 -or $reported -ne "ykeys $version") {
            throw "ykeys.exe failed to run after signing (reported '$reported')"
          }
      # ----------------------------------------------------------------------

      - name: Package zip
        run: |
          $version = $env:TAG.TrimStart('v')
          Compress-Archive -Path publish/ykeys.exe, LICENSE -DestinationPath "publish/ykeys-$version-win-x64.zip"

      - name: Checksums
        run: |
          $version = $env:TAG.TrimStart('v')
          cd publish
          Get-FileHash ykeys.exe, "ykeys-$version-win-x64.zip" -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $assets = @(
            'publish/ykeys.exe'
            "publish/ykeys-$version-win-x64.zip"
            'publish/SHA256SUMS.txt'
          )
          # Idempotent: a re-run after a partial failure must replace the
          # assets, not die on 'already exists'.
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @assets --clobber
            # A failed upload must not be masked by the edit below going green —
            # that would publish a release whose assets are missing or stale.
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # A cancelled create can orphan a DRAFT release, which `view` still
            # finds; drafts serve no assets and hide from /releases/latest.
            gh release edit $env:TAG --draft=false
          } else {
            gh release create $env:TAG @assets --title "YKeys $env:TAG" --generate-notes
          }
